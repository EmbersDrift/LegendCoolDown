pluginManagement {
    repositories {
        maven { url = 'https://maven.fabricmc.net/' }
        mavenCentral()
        gradlePluginPortal()
    }
}
rootProject.name = 'LegendCoolDown'
// Use complete Minecraft versions for both logical project names and physical directories.
['1.21.11', '26.1.2', '26.2'].each { minecraftVersion ->
    def projectName = "minecraft-${minecraftVersion}"
    include projectName
    project(":${projectName}").projectDir = file("versions/${projectName}")
}
